# local dev dependencies. the apps themselves run with `pnpm dev`.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: passport
      POSTGRES_PASSWORD: passport
      POSTGRES_DB: passport
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passport"]
      interval: 5s
      retries: 10

  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "127.0.0.1:3100:3000"

volumes:
  db-data:
